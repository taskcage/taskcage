name: Validate release candidate

on:
  workflow_dispatch:
    inputs:
      daemon_version:
        description: Daemon version to validate before creating its tag (for example, 0.4.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  container-e2e:
    name: Containerized Java E2E (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64
            runner: ubuntu-24.04
          - platform: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: bash dev/container/run-e2e.sh

  ffmpeg-reference:
    name: FFmpeg Local reference
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Ubuntu FFmpeg package
        run: sudo bash scripts/ci/install-ffmpeg.sh
      - run: bash integration-tests/ffmpeg-reference-workflow.sh

  release-artifacts:
    name: Archive and external Java consumer
    needs: [container-e2e, ffmpeg-reference]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DAEMON_VERSION: ${{ inputs.daemon_version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify release versions before tagging
        run: |
          bash scripts/release/verify-version.sh taskcaged "${DAEMON_VERSION}"
          java_sdk_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' java-sdk/build.gradle.kts | head -n 1)"
          bash scripts/release/verify-version.sh java-sdk "${java_sdk_version}"
      - name: Build daemon archive and checksum
        run: bash scripts/release/build-daemon-archive.sh "${DAEMON_VERSION}" dist
      - name: Build taskcage CLI archive and checksum
        run: bash scripts/release/build-taskcage-cli-archive.sh "${DAEMON_VERSION}" dist
      - name: Build Java release candidates and verify a clean external consumer
        run: bash integration-tests/java-release-consumer-smoke.sh dist
      - name: Install from the release archive
        run: |
          archive="dist/taskcage-v${DAEMON_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          bash integration-tests/release-artifact-smoke.sh \
            "${DAEMON_VERSION}" \
            "${archive}" \
            "${archive}.sha256" \
            dist/install-taskcaged.sh
      - name: Verify the taskcage CLI release archive
        run: |
          archive="dist/taskcage-cli-v${DAEMON_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          bash integration-tests/taskcage-cli-artifact-smoke.sh \
            "${DAEMON_VERSION}" \
            "${archive}" \
            "${archive}.sha256"
      - name: Upload validation artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: taskcage-release-candidate-${{ inputs.daemon_version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
