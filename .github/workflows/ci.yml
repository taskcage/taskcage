name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect CI-relevant changes
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.filter.outputs.runtime }}
      container: ${{ steps.filter.outputs.container }}
      systemd: ${{ steps.filter.outputs.systemd }}
      ffmpeg: ${{ steps.filter.outputs.ffmpeg }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 "${HEAD_SHA}")"
          fi
          git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > changed-files.txt

          matches() {
            grep --extended-regexp --quiet "$1" changed-files.txt
          }
          set_output() {
            local name="$1"
            shift
            if matches "$*"; then
              echo "${name}=true" >>"${GITHUB_OUTPUT}"
            else
              echo "${name}=false" >>"${GITHUB_OUTPUT}"
            fi
          }

          set_output runtime '^(Cargo\.(toml|lock)$|core/|daemon/|test-fixtures/|integration-tests/(preflight-fail-closed|cgroup-runner-smoke)\.sh$|\.github/workflows/ci\.yml$)'
          set_output container '^(Cargo\.(toml|lock)$|core/|daemon/|test-fixtures/|java-sdk/|protocol-fixtures/|examples/ffmpeg-java/|dev/container/|\.github/workflows/ci\.yml$)'
          set_output systemd '^(Cargo\.(toml|lock)$|core/|daemon/|test-fixtures/|packaging/ubuntu/|integration-tests/systemd-service-smoke\.sh$|\.github/workflows/ci\.yml$)'
          set_output ffmpeg '^(Cargo\.(toml|lock)$|core/|daemon/|test-fixtures/|java-sdk/|protocol-fixtures/|examples/ffmpeg-java/|dev/container/(Dockerfile|entrypoint\.sh|prepare-ffmpeg-package\.sh|prepare-ffmpeg-bundle\.sh)|integration-tests/ffmpeg-reference-workflow\.sh|scripts/ci/install-ffmpeg\.sh|\.github/workflows/ci\.yml$)'

  java:
    name: Java SDK protocol fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - run: ./gradlew test --rerun-tasks --no-daemon --no-problems-report
        working-directory: java-sdk

  container-e2e:
    name: Containerized Java E2E
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: bash dev/container/run-e2e.sh

  remote-container-e2e:
    name: Remote TLS Capsule E2E
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: bash dev/container/run-remote-e2e.sh

  container-e2e-arm64:
    name: Containerized Java E2E (ARM64)
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.container == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: bash dev/container/run-e2e.sh

  rust:
    name: Rust daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  rust-msrv:
    name: Rust 1.88 minimum version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: "1.88.0"
      - run: cargo test --workspace --locked

  cgroup-preflight:
    name: Linux cgroup 사전 검사
    needs: [changes, rust]
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
      - run: bash integration-tests/preflight-fail-closed.sh

  cgroup-runner:
    name: Linux cgroup 원자적 실행
    needs: cgroup-preflight
    if: needs.cgroup-preflight.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
      - run: bash integration-tests/cgroup-runner-smoke.sh

  systemd-service:
    name: Ubuntu systemd service
    needs: [changes, rust]
    if: needs.changes.outputs.systemd == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
      - run: bash integration-tests/systemd-service-smoke.sh

  ffmpeg-reference:
    name: FFmpeg Local reference
    needs: changes
    if: needs.changes.outputs.ffmpeg == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Ubuntu FFmpeg package
        run: sudo bash scripts/ci/install-ffmpeg.sh
      - run: bash integration-tests/ffmpeg-reference-workflow.sh
