name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: 데몬 종료 신호 확인
        shell: bash
        run: |
          set -euo pipefail
          cargo build --workspace
          ./target/debug/taskcaged &
          daemon_pid=$!
          trap 'kill -KILL "${daemon_pid}" 2>/dev/null || true' EXIT
          sleep 1
          kill -TERM "${daemon_pid}"
          wait "${daemon_pid}"
          trap - EXIT
