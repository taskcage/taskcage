name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    name: Java SDK protocol fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - run: ./gradlew test --rerun-tasks --no-daemon --no-problems-report
        working-directory: java-sdk
      - run: ./java-sdk/gradlew -p java-bindings/ffmpeg test --rerun-tasks --no-daemon --no-problems-report

  container-e2e:
    name: Containerized Java E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: bash dev/container/run-e2e.sh

  container-e2e-arm64:
    name: Containerized Java E2E (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: bash dev/container/run-e2e.sh

  rust:
    name: Rust daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  rust-msrv:
    name: Rust 1.88 minimum version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: "1.88.0"
      - run: cargo test --workspace --locked

  cgroup-preflight:
    name: Linux cgroup 사전 검사
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
      - run: bash integration-tests/preflight-fail-closed.sh

  cgroup-runner:
    name: Linux cgroup 원자적 실행
    needs: cgroup-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
      - run: bash integration-tests/cgroup-runner-smoke.sh

  systemd-service:
    name: Ubuntu systemd service
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
      - run: bash integration-tests/systemd-service-smoke.sh

  ffmpeg-reference:
    name: FFmpeg Local reference
    needs: [cgroup-runner, systemd-service]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Ubuntu FFmpeg package
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: bash integration-tests/ffmpeg-reference-workflow.sh

  release-candidate:
    name: Public Alpha release candidate
    needs: [ffmpeg-reference, container-e2e-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Build daemon archive and checksum
        run: bash scripts/release/build-daemon-archive.sh 0.4.0 dist
      - name: Build Java release candidates and verify a clean external consumer
        run: bash integration-tests/java-release-consumer-smoke.sh dist
      - name: Verify component release tags
        run: |
          bash scripts/release/verify-version.sh taskcaged 0.4.0 taskcaged-v0.4.0
          bash scripts/release/verify-version.sh java-sdk 0.2.0 java-sdk-v0.2.0
          bash scripts/release/verify-version.sh ffmpeg-binding 0.1.0 ffmpeg-binding-v0.1.0
      - name: Install from the release archive
        run: |
          bash integration-tests/release-artifact-smoke.sh \
            0.4.0 \
            dist/taskcage-v0.4.0-x86_64-unknown-linux-gnu.tar.gz \
            dist/taskcage-v0.4.0-x86_64-unknown-linux-gnu.tar.gz.sha256 \
            dist/install-taskcaged.sh
      - name: Upload validation-only release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: taskcage-release-candidates-validation-only
          path: dist/*
          if-no-files-found: error
          retention-days: 7
