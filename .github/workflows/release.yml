name: Public Alpha release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Prepare a private Central deployment and draft release, or finalize both.
        required: true
        type: choice
        options:
          - prepare
          - finalize
      tag:
        description: Existing release tag, for example v0.1.0-alpha.1.
        required: true
        type: string
      central_deployment_id:
        description: Required only for finalize; copied from the prepare job and draft release notes.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: public-alpha-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag and version
    runs-on: ubuntu-24.04
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - id: version
        name: Match the tag, manifests, and main history
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          release_version="${RELEASE_TAG#v}"
          bash scripts/release/verify-version.sh "${release_version}" "${RELEASE_TAG}"
          git tag --points-at HEAD --list "${RELEASE_TAG}" | grep -Fx "${RELEASE_TAG}"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          echo "release_version=${release_version}" >>"${GITHUB_OUTPUT}"

  rust-java-gate:
    name: Rust and Java release gate
    if: inputs.mode == 'prepare'
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: ./gradlew build --no-daemon --no-problems-report
        working-directory: java-sdk

  cgroup-preflight-gate:
    name: cgroup preflight release gate
    if: inputs.mode == 'prepare'
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
      - run: bash integration-tests/preflight-fail-closed.sh

  cgroup-runner-gate:
    name: cgroup runner release gate
    if: inputs.mode == 'prepare'
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
      - run: bash integration-tests/cgroup-runner-smoke.sh

  systemd-gate:
    name: systemd release gate
    if: inputs.mode == 'prepare'
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
      - run: bash integration-tests/systemd-service-smoke.sh

  ffmpeg-gate:
    name: FFmpeg release gate
    if: inputs.mode == 'prepare'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Ubuntu FFmpeg package
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: bash integration-tests/ffmpeg-reference-workflow.sh

  package-daemon:
    name: Package daemon release assets
    if: inputs.mode == 'prepare'
    needs:
      - validate
      - rust-java-gate
      - cgroup-preflight-gate
      - cgroup-runner-gate
      - systemd-gate
      - ffmpeg-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
      - run: bash scripts/release/build-daemon-archive.sh "${RELEASE_VERSION}" dist
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: taskcage-daemon-${{ inputs.tag }}
          path: dist/*
          if-no-files-found: error

  prepare:
    name: Prepare private Central deployment and draft release
    if: inputs.mode == 'prepare'
    needs:
      - validate
      - package-daemon
    runs-on: ubuntu-24.04
    environment: public-alpha-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: taskcage-daemon-${{ inputs.tag }}
          path: dist
      - name: Build the release-signed Central bundle
        env:
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: bash scripts/release/build-central-bundle.sh "${RELEASE_VERSION}" dist
      - name: Preserve the signed Central bundle for recovery
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: taskcage-central-${{ inputs.tag }}
          path: dist/taskcage-java-sdk-*-central.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload USER_MANAGED deployment and create a draft GitHub release
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "ERROR: a GitHub release already exists for ${RELEASE_TAG}" >&2
            exit 1
          fi
          central_pom_url="https://repo1.maven.org/maven2/io/github/taskcage/taskcage-java-sdk/${RELEASE_VERSION}/taskcage-java-sdk-${RELEASE_VERSION}.pom"
          central_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${central_pom_url}")"
          case "${central_status}" in
            404) ;;
            200)
              echo "ERROR: io.github.taskcage:taskcage-java-sdk:${RELEASE_VERSION} is already public" >&2
              exit 1
              ;;
            *)
              echo "ERROR: Maven Central availability check returned HTTP ${central_status}" >&2
              exit 1
              ;;
          esac
          deployment_id="$(bash scripts/release/central-portal.sh \
            upload \
            "dist/taskcage-java-sdk-${RELEASE_VERSION}-central.zip" \
            "taskcage-java-sdk-${RELEASE_VERSION}")"
          release_notes="$(printf 'Central USER_MANAGED deployment: %s\n\nThis release remains private until the deployment is validated and the finalize mode confirms PUBLISHED.' "${deployment_id}")"
          gh release create "${RELEASE_TAG}" \
            dist/taskcage-v*-x86_64-unknown-linux-gnu.tar.gz \
            dist/taskcage-v*-x86_64-unknown-linux-gnu.tar.gz.sha256 \
            --draft \
            --prerelease \
            --verify-tag \
            --title "TaskCage ${RELEASE_TAG}" \
            --notes "${release_notes}"
          echo "Central deployment ID: ${deployment_id}" >>"${GITHUB_STEP_SUMMARY}"

  finalize:
    name: Publish Central deployment and GitHub prerelease
    if: inputs.mode == 'finalize'
    needs: validate
    runs-on: ubuntu-24.04
    environment: public-alpha-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
      - name: Publish only the deployment bound to the draft release
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          CENTRAL_DEPLOYMENT_ID: ${{ inputs.central_deployment_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "${CENTRAL_DEPLOYMENT_ID}" =~ ^[0-9a-fA-F-]{36}$ ]] || {
            echo "ERROR: finalize requires a valid central_deployment_id" >&2
            exit 1
          }
          release_json="$(gh release view "${RELEASE_TAG}" --json body,isDraft,isPrerelease)"
          release_body="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["body"])' <<<"${release_json}")"
          release_is_draft="$(python3 -c 'import json,sys; print(str(json.load(sys.stdin)["isDraft"]).lower())' <<<"${release_json}")"
          release_is_prerelease="$(python3 -c 'import json,sys; print(str(json.load(sys.stdin)["isPrerelease"]).lower())' <<<"${release_json}")"
          [[ "${release_is_prerelease}" == "true" ]] || {
            echo "ERROR: finalize requires the bound GitHub release to be a prerelease" >&2
            exit 1
          }
          grep -F "${CENTRAL_DEPLOYMENT_ID}" <<<"${release_body}" >/dev/null || {
            echo "ERROR: deployment ID is not bound to the draft release" >&2
            exit 1
          }

          central_state() {
            bash scripts/release/central-portal.sh status "${CENTRAL_DEPLOYMENT_ID}" | \
              python3 -c 'import json,sys; print(json.load(sys.stdin)["deploymentState"])'
          }

          state="$(central_state)"
          if [[ "${release_is_draft}" != "true" && "${state}" != "PUBLISHED" ]]; then
            echo "ERROR: GitHub release is public while Central is not PUBLISHED (${state})" >&2
            exit 1
          fi
          if [[ "${state}" == "VALIDATED" ]]; then
            bash scripts/release/central-portal.sh publish "${CENTRAL_DEPLOYMENT_ID}"
          elif [[ "${state}" != "PUBLISHED" ]]; then
            echo "ERROR: Central deployment must be VALIDATED or PUBLISHED, got ${state}" >&2
            exit 1
          fi

          for _ in {1..60}; do
            state="$(central_state)"
            case "${state}" in
              PUBLISHED) break ;;
              FAILED)
                bash scripts/release/central-portal.sh status "${CENTRAL_DEPLOYMENT_ID}" >&2
                exit 1
                ;;
              PUBLISHING|VALIDATING|PENDING) sleep 10 ;;
              *)
                echo "ERROR: unexpected Central state while finalizing: ${state}" >&2
                exit 1
                ;;
            esac
          done
          [[ "${state}" == "PUBLISHED" ]] || {
            echo "ERROR: Central did not reach PUBLISHED within 10 minutes" >&2
            exit 1
          }

          if [[ "${release_is_draft}" == "true" ]]; then
            gh release edit "${RELEASE_TAG}" --draft=false --prerelease
          else
            echo "GitHub release ${RELEASE_TAG} is already public"
          fi
