name: Release FFmpeg Binding

on:
  push:
    tags:
      - "ffmpeg-binding-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing FFmpeg Binding release tag, for example ffmpeg-binding-v0.1.0.
        required: true
        type: string
      central_deployment_id:
        description: Central deployment ID recorded in the draft release.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ffmpeg-binding-release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate FFmpeg Binding tag and version
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.context.outputs.mode }}
      release_tag: ${{ steps.context.outputs.release_tag }}
      release_version: ${{ steps.context.outputs.release_version }}
    steps:
      - id: context
        name: Resolve release context
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${EVENT_NAME}" == "push" ]]; then
            mode="prepare"
            release_tag="${PUSH_TAG}"
          else
            mode="finalize"
            release_tag="${INPUT_TAG}"
          fi
          [[ "${release_tag}" =~ ^ffmpeg-binding-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          release_version="${release_tag#ffmpeg-binding-v}"
          echo "mode=${mode}" >>"${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >>"${GITHUB_OUTPUT}"
          echo "release_version=${release_version}" >>"${GITHUB_OUTPUT}"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.context.outputs.release_tag }}
          fetch-depth: 0
      - name: Match the tag, manifest, and main history
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.context.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.context.outputs.release_version }}
        run: |
          bash scripts/release/verify-version.sh ffmpeg-binding "${RELEASE_VERSION}" "${RELEASE_TAG}"
          git tag --points-at HEAD --list "${RELEASE_TAG}" | grep -Fx "${RELEASE_TAG}"
          tag_object_sha="$(git rev-parse "${RELEASE_TAG}^{tag}")"
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" --jq '.verification.verified')" == "true" ]]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

  java-gate:
    name: FFmpeg Binding release gate
    if: needs.validate.outputs.mode == 'prepare'
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - run: ./java-sdk/gradlew -p java-bindings/ffmpeg clean build --no-daemon --no-problems-report

  container-gate:
    name: FFmpeg Binding and daemon compatibility gate
    if: needs.validate.outputs.mode == 'prepare'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: bash dev/container/run-e2e.sh

  prepare:
    name: Prepare Central deployment and draft release
    if: needs.validate.outputs.mode == 'prepare'
    needs:
      - validate
      - java-gate
      - container-gate
    runs-on: ubuntu-24.04
    environment: java-sdk-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the release-signed Central bundle
        env:
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: bash scripts/release/build-ffmpeg-binding-central-bundle.sh "${RELEASE_VERSION}" dist
      - name: Preserve the signed Central bundle for recovery
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: taskcage-ffmpeg-binding-${{ needs.validate.outputs.release_version }}-central
          path: dist/taskcage-ffmpeg-binding-*-central.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload USER_MANAGED deployment and create a draft GitHub release
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "ERROR: a GitHub release already exists for ${RELEASE_TAG}" >&2
            exit 1
          fi
          core_pom_url="https://repo1.maven.org/maven2/org/taskcage/taskcage-java-sdk/0.2.0/taskcage-java-sdk-0.2.0.pom"
          [[ "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${core_pom_url}")" == "200" ]] || {
            echo "ERROR: org.taskcage:taskcage-java-sdk:0.2.0 must be public before the Binding" >&2
            exit 1
          }
          daemon_release="$(gh release view taskcaged-v0.2.0 --json isDraft,isPrerelease,tagName)" || {
            echo "ERROR: taskcaged-v0.2.0 must be public before the Binding" >&2
            exit 1
          }
          python3 -c 'import json,sys; release=json.load(sys.stdin); assert not release["isDraft"] and release["isPrerelease"] and release["tagName"] == "taskcaged-v0.2.0", "taskcaged-v0.2.0 is not a public prerelease"' <<<"${daemon_release}"
          central_pom_url="https://repo1.maven.org/maven2/org/taskcage/taskcage-ffmpeg-binding/${RELEASE_VERSION}/taskcage-ffmpeg-binding-${RELEASE_VERSION}.pom"
          central_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${central_pom_url}")"
          case "${central_status}" in
            404) ;;
            200)
              echo "ERROR: org.taskcage:taskcage-ffmpeg-binding:${RELEASE_VERSION} is already public" >&2
              exit 1
              ;;
            *)
              echo "ERROR: Maven Central availability check returned HTTP ${central_status}" >&2
              exit 1
              ;;
          esac
          deployment_id="$(bash scripts/release/central-portal.sh \
            upload \
            "dist/taskcage-ffmpeg-binding-${RELEASE_VERSION}-central.zip" \
            "taskcage-ffmpeg-binding-${RELEASE_VERSION}")"
          release_notes="$(printf 'TaskCage FFmpeg Binding %s\n\nRequires Java Core SDK: 0.2.0\nRequires taskcaged: 0.2.0 with ffmpeg-audio-to-wav@1.0.0 configured\nSupported Protocol: v2\nMaven: org.taskcage:taskcage-ffmpeg-binding:%s\n\nCentral USER_MANAGED deployment: %s\n\nReview and complete these notes before finalizing publication.' "${RELEASE_VERSION}" "${RELEASE_VERSION}" "${deployment_id}")"
          gh release create "${RELEASE_TAG}" \
            --draft \
            --prerelease \
            --verify-tag \
            --title "TaskCage FFmpeg Binding ${RELEASE_VERSION}" \
            --notes "${release_notes}"
          echo "Central deployment ID: ${deployment_id}" >>"${GITHUB_STEP_SUMMARY}"

  finalize:
    name: Publish Central deployment and GitHub prerelease
    if: needs.validate.outputs.mode == 'finalize'
    needs: validate
    runs-on: ubuntu-24.04
    environment: java-sdk-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.release_tag }}
      - name: Publish only the deployment bound to the draft release
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          CENTRAL_DEPLOYMENT_ID: ${{ inputs.central_deployment_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          [[ "${CENTRAL_DEPLOYMENT_ID}" =~ ^[0-9a-fA-F-]{36}$ ]] || {
            echo "ERROR: finalize requires a valid central_deployment_id" >&2
            exit 1
          }
          release_json="$(gh release view "${RELEASE_TAG}" --json body,isDraft,isPrerelease)"
          release_body="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["body"])' <<<"${release_json}")"
          release_is_draft="$(python3 -c 'import json,sys; print(str(json.load(sys.stdin)["isDraft"]).lower())' <<<"${release_json}")"
          release_is_prerelease="$(python3 -c 'import json,sys; print(str(json.load(sys.stdin)["isPrerelease"]).lower())' <<<"${release_json}")"
          [[ "${release_is_prerelease}" == "true" ]]
          grep -F "${CENTRAL_DEPLOYMENT_ID}" <<<"${release_body}" >/dev/null

          central_state() {
            bash scripts/release/central-portal.sh status "${CENTRAL_DEPLOYMENT_ID}" | \
              python3 -c 'import json,sys; print(json.load(sys.stdin)["deploymentState"])'
          }

          state="$(central_state)"
          if [[ "${release_is_draft}" != "true" && "${state}" != "PUBLISHED" ]]; then
            echo "ERROR: GitHub release is public while Central is not PUBLISHED (${state})" >&2
            exit 1
          fi
          if [[ "${state}" == "VALIDATED" ]]; then
            bash scripts/release/central-portal.sh publish "${CENTRAL_DEPLOYMENT_ID}"
          elif [[ "${state}" != "PUBLISHED" ]]; then
            echo "ERROR: Central deployment must be VALIDATED or PUBLISHED, got ${state}" >&2
            exit 1
          fi

          for _ in {1..60}; do
            state="$(central_state)"
            case "${state}" in
              PUBLISHED) break ;;
              FAILED)
                bash scripts/release/central-portal.sh status "${CENTRAL_DEPLOYMENT_ID}" >&2
                exit 1
                ;;
              PUBLISHING|VALIDATING|PENDING) sleep 10 ;;
              *)
                echo "ERROR: unexpected Central state while finalizing: ${state}" >&2
                exit 1
                ;;
            esac
          done
          [[ "${state}" == "PUBLISHED" ]] || {
            echo "ERROR: Central did not reach PUBLISHED within 10 minutes" >&2
            exit 1
          }

          if [[ "${release_is_draft}" == "true" ]]; then
            gh release edit "${RELEASE_TAG}" --draft=false --prerelease
          else
            echo "GitHub release ${RELEASE_TAG} is already public"
          fi
