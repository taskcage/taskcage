name: taskcage

services:
  taskcaged:
    image: ${TASKCAGE_IMAGE:-ghcr.io/taskcage/taskcaged}:${TASKCAGE_VERSION:?Set TASKCAGE_VERSION to a published daemon version}
    privileged: true
    cgroup: private
    stop_grace_period: 15s
    volumes:
      - taskcage-runtime:/run/taskcage
      - taskcage-data:/var/lib/taskcage

volumes:
  taskcage-runtime:
  taskcage-data:
