<!doctype html><html lang="ko"><meta charset="utf-8"><title>TaskCage Benchmark Lab</title>
<style>body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;color:#17212b}.card{border:1px solid #d8dee4;border-radius:8px;padding:16px;margin:12px 0}pre{overflow:auto;background:#f6f8fa;padding:12px}</style>
<h1>TaskCage Benchmark Lab</h1><div class="card"><b id="phase">준비 중</b><p id="detail"></p></div><div class="card"><h2>실시간 daemon metrics</h2><pre id="metrics">수집 대기 중</pre></div><div class="card"><h2>컨테이너 표본</h2><pre id="containers">수집 대기 중</pre></div><p>완료 후 같은 실행 디렉터리의 <code>report.html</code>에서 최종 비교 결과를 확인합니다.</p>
<script>async function refresh(){try{const s=await fetch('live.json?'+Date.now()).then(x=>x.json());phase.textContent=s.phase;detail.textContent=[s.scenario,s.mode].filter(Boolean).join(' · ');const p=s.samples.at(-1);metrics.textContent=p?JSON.stringify(p.daemonMetrics,null,2):'수집 대기 중';containers.textContent=p?JSON.stringify({daemon:p.daemonContainer,worker:p.workerContainer},null,2):'수집 대기 중'}catch(_){}}setInterval(refresh,500);refresh()</script>
