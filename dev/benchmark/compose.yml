name: taskcage-benchmark

services:
  taskcaged:
    image: taskcage-benchmark/taskcaged:local
    build:
      context: ../..
      dockerfile: dev/container/Dockerfile
      target: daemon
    privileged: true
    cgroup: private
    pid: host
    environment:
      TASKCAGE_INSTALL_BENCHMARK_CAPSULES: "true"
    ports:
      - "127.0.0.1:19098:9098"
    stop_grace_period: 15s
    command:
      - serve
      - --socket
      - /run/taskcage/taskcaged.sock
      - --metrics-listen
      - 0.0.0.0:9098
      - --max-concurrent-tasks
      - ${BENCHMARK_MAX_CONCURRENT_TASKS:-4}
      - --max-registry-tasks
      - "1000"
      - --max-concurrent-connections
      - "32"
      - --cleanup-timeout-ms
      - "5000"
      - --fail-stop-timeout-ms
      - "10000"
      - --max-task-cpu-quota-us
      - "200000"
      - --max-task-cpu-period-us
      - "100000"
      - --max-task-memory-bytes
      - "2147483648"
      - --max-task-pids
      - "128"
      - --max-task-timeout-ms
      - "900000"
      - --max-task-stdout-tail-bytes
      - "65536"
      - --max-task-stderr-tail-bytes
      - "65536"
      - --profile-artifact-root
      - /taskcage-work/artifacts
      - --profile-artifact-max-bytes
      - "104857600"
    volumes:
      - taskcage-runtime:/run/taskcage
      - taskcage-work:/taskcage-work
    healthcheck:
      test: ["CMD", "/usr/local/bin/taskcaged", "status", "--socket", "/run/taskcage/taskcaged.sock", "--timeout-ms", "1000"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s

  benchmark-worker:
    image: taskcage-benchmark/worker:local
    profiles: [benchmark]
    cpus: ${BENCHMARK_WORKER_CPUS:-1.0}
    build:
      context: ../..
      dockerfile: dev/container/Dockerfile
      target: benchmark-worker
    depends_on:
      taskcaged:
        condition: service_healthy
    environment:
      TASKCAGE_SOCKET: /run/taskcage/taskcaged.sock
      TASKCAGE_ARTIFACT_ROOT: /taskcage-work/artifacts
    volumes:
      - taskcage-runtime:/run/taskcage
      - taskcage-work:/taskcage-work
      - ${BENCHMARK_INPUT_HOST_PATH:-/dev/null}:/benchmark-input/input:ro

volumes:
  taskcage-runtime:
  taskcage-work:
